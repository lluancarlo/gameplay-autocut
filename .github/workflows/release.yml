# Builds VVideo.exe on Windows and publishes it as a release zip.
#
#   push to master                              -> rolling `latest` prerelease
#   git tag v1.0.0 && git push origin v1.0.0    -> permanent release for the tag
#   Actions -> Release -> Run workflow          -> build only, artifact, no release
#
# The release carries three files: the zip, a SHA-256 checksum file, and a
# build provenance attestation. Together they answer the two questions an
# unsigned .exe always gets -- "is this the file the repo built?" and "has it
# been tampered with since?" -- without a code signing certificate. Antivirus
# false positives on PyInstaller output are common; a verifiable hash plus a
# GitHub-attested build is what a user can check before running it.
name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign the provenance attestation
      attestations: write # record it against this repo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build VVideo.exe
        run: pyinstaller VVideo.spec --noconfirm --clean

      # The zip holds the publish folder: VVideo.exe and its libraries.
      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path publish/VVideo.exe)) { throw "publish/VVideo.exe was not built" }
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path publish/* -DestinationPath release/VVideo.zip -CompressionLevel Optimal

      # Both hashes: the zip is what gets downloaded, the .exe is what actually
      # runs, and a user who has already extracted it can only check the second.
      - name: Checksums
        shell: pwsh
        run: |
          $lines = foreach ($f in @('release/VVideo.zip', 'publish/VVideo.exe')) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Write-Host
          Set-Content -Path release/SHA256SUMS.txt -Value $lines -Encoding ascii

      # Signed statement, verifiable with `gh attestation verify`, that this
      # exact zip came out of this workflow at this commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/VVideo.zip

      # Kept for workflow_dispatch runs, which publish nothing.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VVideo-${{ github.sha }}
          path: |
            release/VVideo.zip
            release/SHA256SUMS.txt

      # Two kinds of release off one build. A tag gets a permanent release
      # under its own name; a master commit overwrites the rolling `latest`
      # prerelease, so the download URL never moves and the tag it hangs on is
      # dragged forward to the new commit. Manual runs publish nothing.
      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $isTag = '${{ github.ref_type }}' -eq 'tag'
          if ($isTag) {
            $tag = '${{ github.ref_name }}'
            $title = "VVideo $tag"
            $extra = @()
          } else {
            $tag = 'latest'
            $title = 'VVideo latest (master)'
            $extra = @('--prerelease')
          }

          # The body lives in .github/release-notes.md -- markdown full of
          # backticks and pipes does not survive being inlined here.
          $notes = Get-Content .github/release-notes.md -Raw
          $notes = $notes.Replace('__VERSION__', $tag)
          $notes = $notes.Replace('__COMMIT__', '${{ github.sha }}')
          $notes = $notes.Replace('__REPO__', '${{ github.repository }}')
          $notes = $notes.Replace('__ZIP_HASH__', (Get-FileHash release/VVideo.zip -Algorithm SHA256).Hash.ToLower())
          $notes = $notes.Replace('__EXE_HASH__', (Get-FileHash publish/VVideo.exe -Algorithm SHA256).Hash.ToLower())
          Set-Content -Path release/notes.md -Value $notes -Encoding utf8

          # Nothing updates a release in place with new assets, so the rolling
          # one is torn down first -- tag included, or the new one would be cut
          # from the old commit.
          if (-not $isTag) {
            gh release view $tag > $null 2>&1
            if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes --cleanup-tag }
          }

          gh release create $tag `
            release/VVideo.zip release/SHA256SUMS.txt `
            --target ${{ github.sha }} `
            --title $title `
            --notes-file release/notes.md `
            @extra
